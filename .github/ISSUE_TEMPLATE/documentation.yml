name: Documentation Issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      description: What kind of documentation problem is this?
      options:
        - Missing documentation
        - Incorrect / outdated information
        - Unclear explanation
        - Broken example / code snippet
        - Typo or grammar
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: URL or file path of the affected documentation.
      placeholder: "https://gridstorm.dev/docs/... or packages/core/README.md"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong or missing?
      description: Describe what is incorrect, unclear, or missing.
      placeholder: The example for `createGrid()` does not show how to pass column definitions...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: If you have a suggestion for how to fix or improve the docs, share it here.
      placeholder: Add an example showing...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, links to related issues, or anything else that would help.
    validations:
      required: false
