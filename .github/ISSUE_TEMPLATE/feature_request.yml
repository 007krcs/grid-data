name: Feature Request
description: Suggest a new feature or enhancement for GridStorm
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you would like.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this feature would solve or the use case it enables.
      placeholder: |
        As a developer building a financial dashboard, I need to...
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API
      description: If you have ideas about how the API should look, share them here.
      placeholder: |
        ```typescript
        // Example usage of the proposed feature
        const grid = createGridEngine({
          // ...
        });
        ```
      render: typescript
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
      placeholder: |
        I considered using X, but it doesn't work because...
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Related Package
      description: Which package would this feature belong to?
      options:
        - "@gridstorm/core"
        - "@gridstorm/dom-renderer"
        - "@gridstorm/react"
        - "@gridstorm/theme-default"
        - "@gridstorm/plugin-sorting"
        - "@gridstorm/plugin-filtering"
        - "@gridstorm/plugin-selection"
        - "@gridstorm/plugin-editing"
        - "@gridstorm/plugin-pagination"
        - "@gridstorm/plugin-column-pinning"
        - "@gridstorm/plugin-column-resize"
        - "@gridstorm/plugin-column-reorder"
        - "@gridstorm/plugin-context-menu"
        - "@gridstorm/plugin-grouping"
        - "@gridstorm/plugin-aggregation"
        - "@gridstorm/plugin-pivoting"
        - "@gridstorm/plugin-clipboard"
        - "@gridstorm/plugin-tree-data"
        - "@gridstorm/plugin-ssrm"
        - "@gridstorm/i18n"
        - "@gridstorm/codemod"
        - "New plugin"
        - "Other / Unknown"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references that would help.
    validations:
      required: false
