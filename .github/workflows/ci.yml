name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run tests with coverage + enforce thresholds
        if: matrix.node-version == 20
        run: pnpm test:run -- --coverage --coverage.thresholds.lines=70 --coverage.thresholds.functions=65 --coverage.thresholds.branches=60

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          for pkg in packages/*/dist; do
            if [ -d "$pkg" ]; then
              name=$(basename $(dirname $pkg))
              size=$(du -sh "$pkg" 2>/dev/null | cut -f1)
              echo "- **$name**: $size" >> $GITHUB_STEP_SUMMARY
            fi
          done

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Measure bundle sizes
        run: |
          echo "## Bundle Size Report (PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Raw | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|---------|" >> $GITHUB_STEP_SUMMARY
          for pkg in packages/*/dist; do
            if [ -d "$pkg" ] && ls "$pkg"/*.js 1>/dev/null 2>&1; then
              name=$(basename $(dirname $pkg))
              raw=$(wc -c < "$pkg"/index.js 2>/dev/null || echo "0")
              gz=$(gzip -c "$pkg"/index.js 2>/dev/null | wc -c || echo "0")
              raw_kb=$(echo "scale=1; $raw/1024" | bc 2>/dev/null || echo "?")
              gz_kb=$(echo "scale=1; $gz/1024" | bc 2>/dev/null || echo "?")
              echo "| $name | ${raw_kb}KB | ${gz_kb}KB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check core bundle size limit
        run: |
          CORE_SIZE=$(wc -c < packages/core/dist/index.js 2>/dev/null || echo "0")
          MAX_SIZE=51200  # 50KB limit
          if [ "$CORE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Core bundle size (${CORE_SIZE} bytes) exceeds limit (${MAX_SIZE} bytes)"
            exit 1
          fi
          echo "Core bundle size: ${CORE_SIZE} bytes (limit: ${MAX_SIZE} bytes)"

      - name: Check react-adapter bundle size limit (20KB)
        run: |
          ADAPTER_SIZE=$(wc -c < packages/react-adapter/dist/index.js 2>/dev/null || echo "0")
          MAX_SIZE=20480  # 20KB limit
          if [ "$ADAPTER_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::react-adapter bundle (${ADAPTER_SIZE} bytes) exceeds 20KB limit"
            exit 1
          fi
          echo "react-adapter bundle size: ${ADAPTER_SIZE} bytes (limit: ${MAX_SIZE} bytes)"

  verify-publish:
    name: Verify publishable tarballs
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Pack every public package with pnpm and assert no `workspace:*`
      # dependency strings survive into the resulting tarballs. Both publish
      # paths in this repo (release.yml -> changeset publish, and
      # scripts/publish-all.cjs) go through `pnpm publish`, which rewrites
      # workspace: refs at pack time. The stricter `pnpm verify:publish:both`
      # mode is available locally for paranoid checks against raw `npm pack`.
      - name: Verify no workspace:* refs in tarballs
        run: pnpm verify:publish

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (hard failure — no || true)
        run: pnpm audit --audit-level=high

      - name: License compliance check
        run: npx --yes license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;Unlicense;Python-2.0'

      - name: Run security unit tests
        run: pnpm vitest run packages/core/src/__tests__/security.test.ts packages/dom-renderer/src/__tests__/security.test.ts

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run benchmarks
        run: pnpm --filter benchmarks bench:report 2>/dev/null || echo "Benchmarks skipped"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 90

  docs:
    name: API Docs (TypeDoc)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate API docs for @gridstorm/core
        run: pnpm --filter @gridstorm/core run docs
        continue-on-error: true

      - name: Generate API docs for @gridstorm/react
        run: pnpm --filter @gridstorm/react run docs 2>/dev/null || echo "No docs script for react adapter"
        continue-on-error: true

      - name: Generate API docs for @gridstorm/angular
        run: pnpm --filter @gridstorm/angular run docs 2>/dev/null || echo "No docs script for angular adapter"
        continue-on-error: true

      - name: Upload generated docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: |
            packages/core/docs/
            packages/react-adapter/docs/
            packages/angular-adapter/docs/
          retention-days: 30
          if-no-files-found: ignore
